<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <style>
    @keyframes netflixZoom {
      0% { transform: scale(1.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .text-container {
      transform-origin: center;
      animation: netflixZoom 2.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }
    .netflix-text {
      fill: #E50914;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 65px;
      letter-spacing: 4px;
      text-anchor: middle;
    }
  </style>
  
  <!-- Solid Black Background -->
  <rect width="100%" height="100%" fill="#000000" />
  
  <g class="text-container">
    <!-- The invisible curve the text follows -->
    <path id="curve" d="M 100,140 Q 400,90 700,140" fill="transparent" />
    <text class="netflix-text">
      <textPath href="#curve" startOffset="50%">
        R.E. AATHAVAN
      </textPath>
    </text>
  </g>
</svg>
